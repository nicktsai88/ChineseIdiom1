                if (!AudioContext) return;

                if (type === 'correct') {
                    // 新版答對音效：清脆悅耳的「叮咚」雙音 (C5 -> E5)
                    const now = ctx.currentTime;
                    const osc1 = ctx.createOscillator(); const gain1 = ctx.createGain();
                    osc1.type = 'sine'; osc1.frequency.setValueAtTime(523.25, now);
                    gain1.gain.setValueAtTime(0.1, now); gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
                    osc1.connect(gain1); gain1.connect(ctx.destination); osc1.start(now); osc1.stop(now + 0.5);

                    const osc2 = ctx.createOscillator(); const gain2 = ctx.createGain();
                    osc2.type = 'sine'; osc2.frequency.setValueAtTime(659.25, now + 0.1);

13. **現身說法**：[釋義] 親身舉例，說明道理。 [例句] 戒菸成功的陳先生現身說法，分享他擺脫菸癮的心路歷程。

15. **明察秋毫**：[釋義] 形容能洞察事理（也指視力敏銳）。 [例句] 法官辦案必須明察秋毫，才能避免冤假錯案。
16. **勿枉勿縱**：[釋義] 不冤枉好人，也不放過壞人。 [例句] 司法審判應秉持勿枉勿縱的精神，才能彰顯社會正義。
17. **大義滅親**：[釋義] 為了維護公理正義，不徇私情，使犯罪的親人受法律制裁。 [例句] 石奢雖然想大義滅親，但內心仍充滿對父親的虧欠。
18. **移孝作忠**：[釋義] 把孝順父母的心，轉移為效忠君主。 [例句] 古代將士常須移孝作忠，辭別父母奔赴沙場保衛國家。
19. **先斬後奏**：[釋義] 比喻先採取行動，然後再回報上級。 [例句] 事情緊急，我只好先斬後奏，請經理原諒我的魯莽。
20. **宵衣旰食**：[釋義] 天未亮就穿衣，天黑才吃飯。形容勤於政事。 [例句] 為了國家的繁榮，總統終日宵衣旰食，極為辛勞。
21. **疾風勁草**：[釋義] 比喻在艱難環境下，才能顯出意志堅強的人。 [例句] 只有在危難時刻，才能看出誰是疾風勁草般的忠臣。
22. **洞燭機先**：[釋義] 預先看清事情的發展徵兆。 [例句] 優秀的企業家總能洞燭機先，在市場變化前搶得商機。
23. **防患未然**：[釋義] 在禍患還沒發生之前就先防備。 [例句] 定期檢查電路是為了防患未然，避免火災發生。
24. **百弊叢生**：[釋義] 各種弊害同時發生。 [例句] 這項舊制度實行多年，如今已是百弊叢生，急需改革。
25. **噤若寒蟬**：[釋義] 形容不敢作聲。 [例句] 面對老闆的怒火，員工們個個噤若寒蟬，不敢多說一句話。
26. **令出如山**：[釋義] 命令一出，如山堅定，不可動搖。 [例句] 軍中紀律嚴明，令出如山，違抗者必受處分。
27. **誅殺無辜**：[釋義] 殺害沒有罪的人。 [例句] 暴君濫殺忠良、誅殺無辜，最終導致民怨沸騰。

## 形容「個人特質、態度、人際互動」
28. **口誅筆伐**：[釋義] 用言語文字揭發譴責。 [例句] 這位貪官的惡行被揭露後，引來各界媒體的口誅筆伐。
29. **唯唯諾諾**：[釋義] 一味順從。 [例句] 他在主管面前總是唯唯諾諾，不敢表達自己的真實想法。
30. **直言不諱**：[釋義] 直截了當地說。 [例句] 對於公司的缺失，他總是直言不諱地提出改進建議。
31. **從善如流**：[釋義] 聽從好的意見十分迅速。 [例句] 一個好的領導者應該從善如流，廣納部屬的建言。
32. **剛愎自用**：[釋義] 固執己見。 [例句] 他因剛愎自用，聽不進別人的勸告，最終導致生意失敗。
33. **師心自用**：[釋義] 自以為是。 [例句] 做學問切忌師心自用，應多參考前人的研究成果。
34. **察納雅言**：[釋義] 採納正直的言論。 [例句] 國君若能察納雅言，國家必能長治久安。
35. **巧言令色**：[釋義] 話好聽但心懷不軌。 [例句] 孔子說：「巧言令色，鮮矣仁」，提醒我們小心花言巧語的人。
36. **剛正不阿**：[釋義] 剛強正直。 [例句] 張釋之剛正不阿的執法態度，贏得了後世的尊敬。
37. **口蜜腹劍**：[釋義] 嘴甜心毒。 [例句] 這種口蜜腹劍的小人，表面和你稱兄道弟，背後卻捅你一刀。
38. **莫逆之交**：[釋義] 心意相投的好友。 [例句] 他們兩人志趣相投，是多年的莫逆之交。
39. **青梅竹馬**：[釋義] 從小一起長大的玩伴。 [例句] 他們是青梅竹馬，長大後自然而然地結為了夫妻。
40. **錙銖必較**：[釋義] 斤斤計較微小的利益。 [例句] 他這個人極度吝嗇，連一塊錢都要錙銖必較。
41. **大相逕庭**：[釋義] 彼此相差很遠。 [例句] 這兩篇文章的觀點大相逕庭，引發了激烈的討論。
42. **殊途同歸**：[釋義] 方法不同，結果相同。 [例句] 雖然我們的學習方法不同，但殊途同歸，最後都考上了理想學校。
43. **一諾千金**：[釋義] 信用極高。 [例句] 他是個一諾千金的人，答應你的事情絕對會辦到。
44. **不屈不撓**：[釋義] 意志堅毅。 [例句] 憑著不屈不撓的精神，他終於克服殘疾，成為知名運動員。
45. **乘風破浪**：[釋義] 志向遠大。 [例句] 畢業生們將要乘風破浪，勇敢追尋自己的夢想。
46. **功成名就**：[釋義] 事業與名聲皆有成就。 [例句] 許多人離鄉背井打拼，就是希望有一天能功成名就，衣錦還鄉。
47. **飛黃騰達**：[釋義] 仕途或事業順利升遷。 [例句] 自從他升任總經理後，從此飛黃騰達，令人羨慕。
48. **鼠目寸光**：[釋義] 目光短淺。 [例句] 做生意要有遠見，若是鼠目寸光，只看眼前利益，很難做大。
49. **勤能補拙**：[釋義] 勤奮可彌補天資不足。 [例句] 雖然他不夠聰明，但深信勤能補拙，每天比別人花更多時間練習。
50. **持盈保泰**：[釋義] 處富貴而不驕，保守平安。 [例句] 企業在全盛時期更應懂得持盈保泰，謹慎經營。
51. **明哲保身**：[釋義] 迴避禍患，保全自己。 [例句] 在混亂的局勢中，許多人選擇明哲保身，不願捲入紛爭。
52. **光風霽月**：[釋義] 形容人胸懷坦蕩。 [例句] 他品格高尚，如光風霽月般令人景仰。
53. **遺世獨立**：[釋義] 清高脫俗，不與世俗往來。 [例句] 這位隱士住在深山中，過著遺世獨立的生活。
54. **據理力爭**：[釋義] 依據道理，極力爭取。 [例句] 面對不合理的收費，消費者有權利據理力爭。
55. **固執不通**：[釋義] 頑固堅持，不知變通。 [例句] 他的想法太過老舊且固執不通，很難與年輕人溝通。
56. **當機立斷**：[釋義] 抓住關鍵時機，立刻做決定。 [例句] 隊長當機立斷下達撤退命令，才保全了隊員的性命。
57. **義憤填膺**：[釋義] 胸中充滿義憤。 [例句] 看到弱小被欺負，他感到義憤填膺，挺身而出。
58. **輕率魯莽**：[釋義] 言行隨便、粗魯衝動。 [例句] 你這樣輕率魯莽地做決定，後果可能會不堪設想。
59. **實事求是**：[釋義] 講求實際，依據事實。 [例句] 科學研究必須秉持實事求是的精神，不能造假數據。
60. **共享天倫**：[釋義] 享受家庭親情的樂趣。 [例句] 中秋節是全家團圓、共享天倫的美好時光。
61. **捕風捉影**：[釋義] 比喻說話或做事沒有事實根據。 [例句] 這些八卦新聞多半是捕風捉影，不足採信。
62. **貽笑大方**：[釋義] 被見識廣博的人譏笑。 [例句] 如果沒有準備好就上台演講，恐怕會貽笑大方。
63. **傾國傾城**：[釋義] 形容女子容貌極為美麗。 [例句] 傳說中楊貴妃有傾國傾城之貌，深受唐玄宗寵愛。
64. **發憤著述**：[釋義] 發奮努力著書立說。 [例句] 司馬遷受刑後發憤著述，終於完成了偉大的《史記》。
65. **忍辱負重**：[釋義] 忍受屈辱怨謗，而承擔重任。 [例句] 為了顧全大局，他決定忍辱負重，不與對方計較。
66. **既往不咎**：[釋義] 對過去的錯誤不再追究責難。 [例句] 既然你已經真心悔改，我們就既往不咎，重新開始吧。
67. **再接再厲**：[釋義] 繼續努力，不再鬆懈。 [例句] 這次考試雖然失利，但他決定再接再厲，下次一定考好。
68. **名列前茅**：[釋義] 成績優異，排在前面。 [例句] 他讀書非常用功，成績總是名列前茅。

## 形容「事物狀態、情境、景色」
69. **絡繹不絕**：[釋義] 人車連續不斷。 [例句] 假日時，前往風景區的遊客絡繹不絕。
70. **撲朔迷離**：[釋義] 事情錯綜複雜，難辨真相。 [例句] 這起案件的案情撲朔迷離，警方花了好幾個月才釐清。
71. **司空見慣**：[釋義] 經常看到，不足為奇。 [例句] 這種誇張的廣告手法，在現代社會早已是司空見慣了。
72. **曇花一現**：[釋義] 美好事物短暫出現。 [例句] 那位歌手爆紅後便銷聲匿跡，如曇花一現般短暫。
73. **白雲蒼狗**：[釋義] 世事變幻無常。 [例句] 分別多年後再相見，不禁令人感嘆世事如白雲蒼狗，變化萬千。
74. **空中樓閣**：[釋義] 脫離實際的理論或虛構事物。 [例句] 沒有執行力的計畫，就像空中樓閣一樣，是不可能實現的。
75. **殺雞取卵**：[釋義] 貪圖眼前小利，損害長遠利益。 [例句] 過度開發山林無異於殺雞取卵，終將破壞生態平衡。
76. **明日黃花**：[釋義] 過時的事物。 [例句] 這款手機去年還很流行，今年卻已成明日黃花，乏人問津。
77. **鏡花水月**：[釋義] 虛幻不實的景象。 [例句] 富貴榮華有如鏡花水月，轉眼即逝，不必過於執著。
78. **手足無措**：[釋義] 驚慌而不知該怎麼辦。 [例句] 突如其來的地震讓大家手足無措，驚恐不已。
79. **固若金湯**：[釋義] 防守嚴密。 [例句] 這座城堡的防禦工事固若金湯，敵人很難攻破。
80. **千瘡百孔**：[釋義] 破壞嚴重。 [例句] 經歷戰火摧殘後，這座城市已是千瘡百孔，百廢待舉。
81. **如釋重負**：[釋義] 責任已盡，心情輕鬆。 [例句] 終於把期末報告交出去了，我感到如釋重負，心情真好。
82. **無徵不信**：[釋義] 沒有證據就不能令人相信。 [例句] 辦案講求證據，無徵不信，不能只憑推測就定罪。
83. **驚鴻一瞥**：[釋義] 美好事物短暫出現。 [例句] 雖然只是驚鴻一瞥，但她美麗的身影已深深印在我腦海裡。
84. **當頭棒喝**：[釋義] 使人立即覺悟的警示。 [例句] 老師的一番話如當頭棒喝，讓我徹底醒悟，不再浪費光陰。
85. **行將就木**：[釋義] 形容年紀已大，壽命將盡。 [例句] 看著窗外枯葉飄落，那位行將就木的老人不禁感嘆生命短暫。
86. **過眼雲煙**：[釋義] 事物消逝極快。 [例句] 功名利祿不過是過眼雲煙，唯有健康與快樂才是真實的。
87. **未雨綢繆**：[釋義] 事前做好準備。 [例句] 我們應該未雨綢繆，多存一點錢以備不時之需。
88. **三人成虎**：[釋義] 謠言惑眾。 [例句] 謠言可怕，三人成虎，原本沒有的事說的人多了，大家也就信了。
89. **失之東隅，收之桑榆**：[釋義] 比喻雖然先在某方面有損失，但終在另一方面有成就。 [例句] 雖然失去了這份工作，但也因此找到了創業的機會，真是失之東隅，收之桑榆。
90. **錯綜複雜**：[釋義] 形容情況複雜，頭緒繁多。 [例句] 這部電影的劇情錯綜複雜，需要專心觀看才能理解。
91. **銷聲匿跡**：[釋義] 隱藏形跡，不再出現。 [例句] 那位通緝犯自從逃到國外後，就銷聲匿跡，音訊全無。
92. **趁虛而入**：[釋義] 趁力量虛弱時侵入。 [例句] 詐騙集團常利用人心的弱點，趁虛而入騙取財物。
93. **知難而退**：[釋義] 遇到困難就退縮（或指明智地退出）。 [例句] 遇到無法解決的難題時，有時知難而退也是一種智慧。
94. **傾家蕩產**：[釋義] 花光全部家產。 [例句] 為了償還賭債，他不得不變賣房產，甚至傾家蕩產。
95. **花團錦簇**：[釋義] 形容五彩繽紛、繁華豔麗的景象。 [例句] 春天到了，陽明山上花團錦簇，美不勝收。
96. **草木扶疏**：[釋義] 形容草木生長茂盛。 [例句] 這座公園裡草木扶疏，是市民休閒運動的好去處。
97. **一成不變**：[釋義] 形容墨守成規，不知變通。 [例句] 生活如果不求變化，總是一成不變，久了也會令人厭倦。
98. **盤根錯節**：[釋義] 形容事情複雜，不易處理。 [例句] 這件弊案背後的利益關係盤根錯節，調查起來非常困難。
99. **班班可考**：[釋義] 事情非常明顯，有憑據可以查證。 [例句] 這些史實班班可考，不容任何人隨意扭曲。

## 源自「歷史故事」或「寓言」
100. **脫穎而出**：[釋義] 比喻顯露才能，超越眾人。 [例句] 經過層層選拔，他終於從眾多參賽者中脫穎而出，奪得冠軍。
101. **一鳴驚人**：[釋義] 平時沒有表現，一有表現就讓人驚訝。 [例句] 他平時默默無聞，沒想到在這次比賽中一鳴驚人，刷新了紀錄。
102. **老馬識途**：[釋義] 比喻閱歷深、經驗豐富的人。 [例句] 迷路時，幸好有位老馬識途的當地人帶路，我們才順利下山。
103. **飛鳥盡，良弓藏**：[釋義] 比喻天下平定後，功臣被廢棄或殺害。 [例句] 歷史上許多功臣在助君王打下江山後，都難逃飛鳥盡，良弓藏的悲慘命運。
104. **狡兔死，走狗烹**：[釋義] 比喻事成之後，有功之人被殺害。 [例句] 范蠡深知狡兔死，走狗烹的道理，所以功成身退，隱居江湖。
105. **指鹿為馬**：[釋義] 比喻混淆是非，顛倒黑白。 [例句] 那位主管為了推卸責任，竟然指鹿為馬，將錯誤全推給部屬。
106. **破釜沉舟**：[釋義] 比喻下定決心，不顧一切地做到底。 [例句] 為了考上理想大學，他展現破釜沉舟的決心，每天苦讀到深夜。
107. **圖窮匕見**：[釋義] 比喻事情發展到最後，真相或本意顯露出來。 [例句] 談判到了最後關頭，對方的野心終於圖窮匕見，露出了真面目。
108. **風蕭蕭兮易水寒**：[釋義] 形容壯士視死如歸的悲壯心情。 [例句] 荊軻出發刺秦王時，吟唱出「風蕭蕭兮易水寒」，令在場眾人動容。
109. **韋編三絕**：[釋義] 形容讀書勤奮。 [例句] 孔子晚年研讀《易經》達到韋編三絕的程度，其好學精神令人佩服。
110. **三令五申**：[釋義] 再三告誡。 [例句] 儘管政府三令五申禁止酒駕，仍有人心存僥倖。
111. **奇貨可居**：[釋義] 比喻依靠某種專長或囤積物資，以獲取暴利。 [例句] 呂不韋認為秦國質子奇貨可居，便全力資助他回國爭奪王位。
112. **驚弓之鳥**：[釋義] 比喻曾受打擊或驚嚇，稍微有點動靜就害怕的人。 [例句] 經歷過那場大地震後，他就像驚弓之鳥，稍有搖晃就嚇得奪門而出。
113. **守株待兔**：[釋義] 比喻拘泥守成，不知變通；或妄想不勞而獲。 [例句] 成功需要努力，不能整天守株待兔，期待機會自動上門。

## 俗諺與名句
114. **智者千慮，必有一失**：[釋義] 聰明的人考慮再周詳，也難免會有失誤。 [例句] 俗話說：「智者千慮，必有一失」，我們做任何決定都應預留轉圜的空間。
115. **失之毫釐，謬以千里**：[釋義] 開始時雖然只差一點點，結果卻會造成很大的錯誤。 [例句] 太空工程的計算必須極度精確，否則失之毫釐，謬以千里，後果不堪設想。
116. **忠言逆耳利於行**：[釋義] 誠懇的勸告聽起來不順耳，但對行為有幫助。 [例句] 雖然朋友的批評很刺耳，但忠言逆耳利於行，你應該虛心接受。
117. **無顏見江東父老**：[釋義] 形容失敗後羞於見故鄉人。 [例句] 考場失利讓他覺得愧對父母，無顏見江東父老。
118. **人不為己，天誅地滅**：[釋義] 強調人性的自私（負面例句）。 [例句] 那個奸商信奉「人不為己，天誅地滅」的歪理，為了賺錢不擇手段。
119. **他山之石，可以攻錯**：[釋義] 比喻借助外力（別人的意見或經驗）來改正自己的缺失。 [例句] 我們可以藉鑑國外的成功經驗，作為他山之石，可以攻錯，改善我們的制度。
120. **明槍易躲，暗箭難防**：[釋義] 公開的攻擊容易躲避，暗地裡的算計難以防備。 [例句] 商場競爭激烈，明槍易躲，暗箭難防，你可千萬要小心對手的手段。`;

                    <div className="flex items-center mb-6"><button onClick={onMenu} className="mr-4 p-2 bg-white rounded-full shadow hover:bg-gray-100"><Icon path={icons.left} className="w-5 h-5"/></button><h2 className="text-2xl font-bold text-gray-800">📜 作答紀錄</h2></div>
                    {historyLog.length === 0 ? <div className="text-center py-20 text-gray-400">尚無紀錄</div> : (
                        <div className="bg-white rounded-xl shadow-sm overflow-hidden"><table className="w-full text-left"><thead className="bg-gray-50 border-b border-gray-200"><tr><th className="p-4 font-bold text-gray-600">日期</th><th className="p-4 font-bold text-gray-600">姓名</th><th className="p-4 font-bold text-gray-600">分類</th><th className="p-4 font-bold text-gray-600">分數</th><th className="p-4 font-bold text-gray-600">操作</th></tr></thead><tbody className="divide-y divide-gray-100">{historyLog.map(log => (<tr key={log.id} className="hover:bg-blue-50 transition-colors"><td className="p-4 text-gray-500 text-sm">{log.date}</td><td className="p-4 font-medium">{log.userName}</td><td className="p-4 text-gray-600">{log.category}</td><td className="p-4"><span className={`font-bold px-2 py-1 rounded ${log.score === log.total ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-700'}`}>{log.score}/{log.total}</span></td><td className="p-4"><button onClick={() => setSelectedLog(log)} className="text-blue-600 hover:text-blue-800 text-sm font-bold">回放</button></td></tr>))}</tbody></table></div>
                    )}
                    <div className="text-center mt-8"><button onClick={() => {if(confirm('確定清除所有紀錄？')) setHistoryLog([])}} className="text-red-400 hover:text-red-600 text-sm flex items-center justify-center mx-auto"><Icon path={icons.trash} className="w-4 h-4 mr-1"/> 清除所有紀錄</button></div>
                </div>
            );
        };

        const MistakeView = ({ mistakes, mistakeLog, setMistakeLog, onMenu, onReviewAll }) => {
            return (
                <div className="max-w-4xl mx-auto">
                    <div className="flex items-center justify-between mb-6">
                        <div className="flex items-center"><button onClick={onMenu} className="mr-4 p-2 bg-white rounded-full shadow hover:bg-gray-100"><Icon path={icons.left} className="w-5 h-5"/></button><h2 className="text-2xl font-bold text-gray-800 flex items-center"><Icon path={icons.alert} className="w-6 h-6 text-red-500 mr-2"/> 錯題本</h2></div>
                        {mistakes.length > 0 && <button onClick={onReviewAll} className="px-6 py-2 bg-red-600 text-white rounded-lg shadow hover:bg-red-700 font-bold animate-pulse">立即複習全部錯題 ({mistakes.length})</button>}
                    </div>
                    {mistakes.length === 0 ? <div className="text-center py-20 bg-white rounded-xl shadow-sm"><div className="text-6xl mb-4">🎉</div><p className="text-xl text-gray-600 font-bold">太棒了！目前沒有錯題</p><p className="text-gray-400 mt-2">繼續保持，去挑戰更多成語吧！</p></div> : (
                        <div className="grid gap-4">{mistakes.map(item => { const log = mistakeLog.find(m => m.id === item.id); return (<div key={item.id} className="bg-white p-5 rounded-xl shadow-sm border-l-4 border-red-400 flex justify-between items-center"><div><h3 className="text-xl font-bold text-gray-800 mb-1">{item.term} <span className="text-xs text-red-500 bg-red-50 px-2 rounded">錯誤 {log.count} 次</span></h3><p className="text-gray-500 text-sm">{item.definition}</p></div><div className="text-xs text-gray-400 text-right">最後錯誤:<br/>{new Date(log.lastMissed).toLocaleDateString()}</div></div>); })}</div>
                    )}
                    {mistakes.length > 0 && <div className="text-center mt-8"><button onClick={() => {if(confirm('確定清空錯題本？')) { setMistakeLog([]); localStorage.setItem('idiomMistakes', '[]'); } }} className="text-gray-400 hover:text-gray-600 text-sm">清空錯題本</button></div>}
                </div>
            );
        };

        const App = () => {
            const [parsedData, setParsedData] = useState({});
            const [categories, setCategories] = useState([]);
            const [currentMode, setCurrentMode] = useState('menu'); 
            const [activeCategory, setActiveCategory] = useState(null);
            const [showNameWarning, setShowNameWarning] = useState(false);
            
            const [userName, setUserName] = useState('');
            const [isLocked, setIsLocked] = useState(false);
            const [lastUser, setLastUser] = useState(() => localStorage.getItem('idiomLastUser'));

            const [favorites, setFavorites] = useState(() => JSON.parse(localStorage.getItem('idiomFavorites')) || []);
            const [historyLog, setHistoryLog] = useState(() => JSON.parse(localStorage.getItem('idiomHistory')) || []);
            const [mistakeLog, setMistakeLog] = useState(() => JSON.parse(localStorage.getItem('idiomMistakes')) || []);
            const [completedDays, setCompletedDays] = useState(() => JSON.parse(localStorage.getItem('idiomCompletedDays')) || []);
            const [learnPage, setLearnPage] = useState(0);

            // AI State
            const [aiData, setAiData] = useState({});
            const [isGeneratingAll, setIsGeneratingAll] = useState(false);

            const [quizQuestions, setQuizQuestions] = useState([]);
            const [quizScore, setQuizScore] = useState(0);
            const [combo, setCombo] = useState(0);
            const [quizPage, setQuizPage] = useState(0);

            useEffect(() => { localStorage.setItem('idiomFavorites', JSON.stringify(favorites)); }, [favorites]);
            useEffect(() => { localStorage.setItem('idiomHistory', JSON.stringify(historyLog)); }, [historyLog]);
            useEffect(() => { localStorage.setItem('idiomMistakes', JSON.stringify(mistakeLog)); }, [mistakeLog]);
            useEffect(() => { localStorage.setItem('idiomCompletedDays', JSON.stringify(completedDays)); }, [completedDays]);
            
            // Login Handlers
            const handleLogin = () => {
                if (userName.trim()) {
                    setIsLocked(true);
                    setShowNameWarning(false);
                    localStorage.setItem('idiomLastUser', userName);
                    setLastUser(userName);
                }
            };

            const handleQuickLogin = () => {
                const storedUser = localStorage.getItem('idiomLastUser');
                if (storedUser) {
                    setUserName(storedUser);
                    setIsLocked(true);
                    setShowNameWarning(false);
                }
            };

            const toggleFavorite = (id) => { setFavorites(prev => prev.includes(id) ? prev.filter(fid => fid !== id) : [...prev, id]); };
            const allItems = useMemo(() => Object.values(parsedData).flat(), [parsedData]);

            const parseData = (text) => {
                if (!text?.trim()) return;
                const lines = text.split('\n');
                const data = {};
                let currentCat = '';
                let count = 0;
                
                lines.forEach(line => {
                    const catMatch = line.match(/^##\s*(.+)/);
                    if (catMatch) {
                        currentCat = catMatch[1].trim();
                        data[currentCat] = [];
                        return;
                    }
                    const idiomMatch = line.match(/^\d+\.\s*\*\*(.+?)\*\*：\s*(.+)/);
                    if (idiomMatch && currentCat) {
                        const term = idiomMatch[1];
                        const rest = idiomMatch[2];
                        let definition = "尚無釋義", sentence = rest;
                        
                        const defIdx = rest.indexOf("[釋義]");
                        const exIdx = rest.indexOf("[例句]");
                        
                        if (defIdx !== -1 && exIdx !== -1) {
                            definition = rest.substring(defIdx + 4, exIdx).trim();
                            sentence = rest.substring(exIdx + 4).trim();
                        }

                        // Mapping logic
                        const desc = IDIOM_DESCRIPTIONS[count + 1] || "暫無情境解說";
                        const imgPath = `images/p${String(count + 1).padStart(3, '0')}.jpg`;

                        data[currentCat].push({
                            id: count++,
                            term, definition, sentence,
                            sentiment: getSentiment(term),
                            desc: desc,
                            image: imgPath
                        });
                    }
                });
                setParsedData(data);
                setCategories(Object.keys(data));
            };

            useEffect(() => { parseData(FULL_DATA_SOURCE); }, []);

            const handleStartQuiz = (category, pageIdx = 0, isMistakeMode = false) => {
                if (!isLocked) { setShowNameWarning(true); return; }
                let questions = [];
                
                if (isMistakeMode) {
                    const mistakeIds = mistakeLog.map(m => m.id);
                    questions = allItems.filter(i => mistakeIds.includes(i.id));
                    questions.sort(() => Math.random() - 0.5);
                } else {
                    let sourceItems = category === '收藏夾' ? allItems.filter(i => favorites.includes(i.id)) : parsedData[category];
                    if (!sourceItems) return; 
                    const start = pageIdx * ITEMS_PER_PAGE;
                    questions = sourceItems.slice(start, start + ITEMS_PER_PAGE);
                }

                if (questions.length === 0) {
                    alert(isMistakeMode ? "目前沒有錯題紀錄！" : "此頁面無題目");
                    return;
                }

                const quizSet = questions.map(item => {
                    let pool = allItems.filter(i => i.id !== item.id);
                    const distractors = pool.sort(() => Math.random() - 0.5).slice(0, 3);
                    const options = [...distractors, item].sort(() => Math.random() - 0.5);
                    return { ...item, options, userAnswer: null, isCorrect: null };
                });

                setQuizQuestions(quizSet);
                setQuizScore(0);
                setCombo(0);
                setQuizPage(pageIdx);
                setActiveCategory(isMistakeMode ? '錯題本' : category);
                setCurrentMode('quiz');
            };

            const handleAnswer = (qIndex, selectedOptionId) => {
                const newQuestions = [...quizQuestions];
                const q = newQuestions[qIndex];
                if (q.userAnswer !== null) return;

                const isCorrect = selectedOptionId === q.id;
                q.userAnswer = selectedOptionId;
                q.isCorrect = isCorrect;

                if (isCorrect) {
                    setQuizScore(s => s + 1);
                    setCombo(c => c + 1);
                    playSoundEffect('correct');
                    confetti({ particleCount: 50, spread: 60, origin: { y: 0.7 } });
                } else {
                    setCombo(0);
                    playSoundEffect('wrong');
                    setMistakeLog(prev => {
                        const existing = prev.find(m => m.id === q.id);
                        const newLog = existing ? prev.map(m => m.id === q.id ? { ...m, count: m.count + 1, lastMissed: new Date().toISOString() } : m) : [...prev, { id: q.id, count: 1, lastMissed: new Date().toISOString() }];
                        localStorage.setItem('idiomMistakes', JSON.stringify(newLog)); // Force save immediately
                        return newLog;
                    });
                }
                setQuizQuestions(newQuestions);
            };

            const finishQuiz = () => {
                const record = { id: Date.now(), date: new Date().toLocaleString(), userName, score: quizScore, total: quizQuestions.length, category: activeCategory, details: quizQuestions.map(q => ({ term: q.term, definition: q.definition, sentence: q.sentence, isCorrect: q.isCorrect, userAnswer: q.options.find(o => o.id === q.userAnswer)?.term || "未作答", correctAnswer: q.term })) };
                setHistoryLog(prev => [record, ...prev]);
                if (activeCategory !== '收藏夾' && activeCategory !== '錯題本') { const key = `${activeCategory}-${quizPage}`; if (!completedDays.includes(key)) { setCompletedDays(prev => [...prev, key]); } }
            };

            return (
                <div className="min-h-screen bg-slate-100 text-gray-900 p-4 md:p-8 flex flex-col">
                    {currentMode === 'menu' && (
                        <MenuView 
                            userName={userName} setUserName={setUserName} showNameWarning={showNameWarning}
                            mistakeLog={mistakeLog} favorites={favorites} categories={categories} parsedData={parsedData}
                            onStartLearn={(cat) => { setActiveCategory(cat); setLearnPage(0); setCurrentMode('learn'); }}
                            onStartQuiz={(cat) => handleStartQuiz(cat, 0)}
                            onViewHistory={() => setCurrentMode('history')}
                            onViewMistakes={() => setCurrentMode('mistakes')}
                            onLogin={handleLogin} isLocked={isLocked} onQuickLogin={handleQuickLogin} lastUser={lastUser}
                        />
                    )}
                    {currentMode === 'learn' && (
                        <LearnView 
                            activeCategory={activeCategory}
                            items={activeCategory === '收藏夾' ? allItems.filter(i => favorites.includes(i.id)) : parsedData[activeCategory]}
                            learnPage={learnPage} setLearnPage={setLearnPage}
                            favorites={favorites} toggleFavorite={toggleFavorite}
                            completedDays={completedDays}
                            onMenu={() => setCurrentMode('menu')}
                            // No AI props needed now
                        />
                    )}
                    {currentMode === 'quiz' && (
                        <QuizView 
                            questions={quizQuestions} score={quizScore} userName={userName} combo={combo}
                            onAnswer={handleAnswer} onFinish={finishQuiz}
                            onMenu={() => setCurrentMode('menu')}
                            onViewHistory={() => setCurrentMode('history')}
                            favorites={favorites} toggleFavorite={toggleFavorite}
                            activeCategory={activeCategory}
                            totalItems={activeCategory === '收藏夾' ? favorites.length : (parsedData[activeCategory]?.length || 0)}
                            quizPage={quizPage}
                            onPageChange={(page) => handleStartQuiz(activeCategory, page)}
                            completedDays={completedDays}
                        />
                    )}
                    {currentMode === 'history' && <HistoryView historyLog={historyLog} setHistoryLog={setHistoryLog} onMenu={() => setCurrentMode('menu')} />}
                    {currentMode === 'mistakes' && (
                        <MistakeView 
                            mistakes={allItems.filter(i => mistakeLog.some(m => m.id === i.id))}
                            mistakeLog={mistakeLog} setMistakeLog={setMistakeLog}
                            onMenu={() => setCurrentMode('menu')}
                            onReviewAll={() => handleStartQuiz(null, 0, true)}
                        />
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
